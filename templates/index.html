<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamareraI - Voice Ordering</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/speaker_fingerprint.js"></script>
</head>
<body>
    <div class="container">
        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Touch to Order Button (shown initially) -->
            <div id="start-button-area" class="start-button-area">
                <button id="start-order-btn" class="start-order-btn">
                    <div class="btn-icon">🎤</div>
                    <div class="btn-text">Touch to Order</div>
                    <div class="btn-subtitle">Tap to start voice ordering</div>
                </button>
            </div>

            <!-- Enrollment Area (hidden initially) -->
            <div id="enrollment-area" class="enrollment-area hidden">
                <div class="enrollment-icon">🎤</div>
                <div class="enrollment-text">Please say:</div>
                <div class="enrollment-phrase">"Hello, I'd like to order"</div>
                <div id="enrollment-status" class="enrollment-status">Listening...</div>
            </div>

            <!-- Status Indicator (hidden initially) -->
            <div id="status-area" class="status-area hidden">
                <div id="status-icon" class="status-icon">◉</div>
                <div id="status-text" class="status-text">Listening</div>
            </div>
        </div>

        <!-- Order Summary Panel -->
        <div id="order-panel" class="order-panel hidden">
            <div class="order-header">
                <h2>Your Order</h2>
                <div id="item-count" class="item-count">0 items</div>
            </div>

            <div id="order-items" class="order-items">
                <!-- Confirmed items section (locked) -->
                <div id="confirmed-section" class="order-section confirmed hidden">
                    <h3>Confirmed Order <span class="lock-icon">🔒</span></h3>
                    <div id="confirmed-items" class="order-items-list"></div>
                </div>

                <!-- New items section (being added) -->
                <div id="new-section" class="order-section new hidden">
                    <h3>Additional Items</h3>
                    <div id="new-items" class="order-items-list"></div>
                </div>

                <p class="empty-state">No items yet</p>
            </div>

            <div class="order-totals">
                <div class="total-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="total-row">
                    <span>Tax</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="total-row total-final">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
            </div>

            <button id="send-order-btn" class="send-order-btn" disabled>
                Send to Kitchen
            </button>
        </div>
    </div>

    <!-- Hidden audio player for TTS -->
    <audio id="audio-player" style="display: none;"></audio>

    <!-- Debug Panel (hidden by default) -->
    <div id="debug-panel" class="debug-panel hidden">
        <div class="debug-header">
            <h3>Debug Info</h3>
            <button id="close-debug" class="debug-close">×</button>
        </div>
        <div id="debug-content" class="debug-content">
            <div class="debug-item">
                <strong>Session:</strong>
                <span id="debug-session">-</span>
            </div>
            <div class="debug-item">
                <strong>Table:</strong>
                <span id="table-name">-</span>
            </div>
            <div class="debug-item">
                <strong>Transcript:</strong>
                <div id="debug-transcript" class="debug-transcript">-</div>
            </div>
            <div class="debug-item">
                <strong>Response:</strong>
                <div id="debug-response" class="debug-response">-</div>
            </div>
        </div>
    </div>

    <!-- Debug toggle button (bottom right) -->
    <button id="show-debug" class="show-debug-btn">🐛</button>

    <!-- Manual reset button (bottom left, for staff/testing) -->
    <button id="reset-session-btn" class="reset-session-btn hidden">Reset Session (Staff)</button>

    <script src="/static/app.js"></script>
</body>
</html>
